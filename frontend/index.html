<!DOCTYPE html>
<!-- #SISTEMA: Configurações da página =============================================================================================================== -->
    <!-- Documentação das CONFIGURAÇÕES DA PÁGINA
        Responsabilidade:
            Definir informações básicas do documento HTML.

        Funções Atuais:
            - idioma da página
            - codificação de caracteres
            - título da aplicação

        Princípio:
            Centralizar configurações necessárias para o navegador
            interpretar corretamente o documento.

        Evitar:
            - lógica de aplicação
            - estilos visuais
            - comportamento do sistema

        Objetivo:
            Garantir que o frontend seja carregado corretamente.

        Expansões Futuras:
            - metadados
            - SEO
            - configurações de compatibilidade
            - manifestos de aplicação
    -->

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mundo Online</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Fim de Configurações da página -->



<!-- #JOGO: Estilo da Interface (aparência visual) ================================================================================================ -->
    <!-- Documentação do ESTILO DA INTERFACE
        Responsabilidade:
            Definir a aparência visual da interface.

        Funções Atuais:
            - cores do sistema
            - posicionamento dos elementos
            - aparência do log
            - aparência do campo de entrada
            - aparência dos botões

        Princípio:
            Controlar exclusivamente a apresentação visual.

        Evitar:
            - lógica de negócio
            - comunicação com backend
            - regras de jogo

        Objetivo:
            Manter separação clara entre visual e comportamento.

        Expansões Futuras:
            - temas visuais
            - responsividade
            - animações
            - acessibilidade
            - personalização de interface
-->
<style>

    body, html {                            /* APLICA A TODO O DOCUMENTO: */
        margin: 0;                              /* Remove margens padrão */
        padding: 0;                             /* Remove preenchimento padrão */
        width: 100%;                            /* Ocupa toda a largura da janela */
    height: 100%;                               /* Ocupa toda a altura da janela */
        background-color: #050505;            /* Fundo vazio escuro */
        overflow: hidden;                       /* Evita scroll na página inteira */
        font-family: monospace;                 /* Fonte monoespaçada para estilo retrô */
        color: #00ffcc;                       /* Cor de texto neon para contraste com o fundo escuro */
    }
    
    #taskbar {                              /* APLICA À BARRA DE TAREFAS SUPERIOR: */
        position: fixed;                        /* Fixa no topo da janela */
        top: 0;                                 /* Alinha ao topo */
        left: 0;                                /* Alinha à esquerda */
        width: 100%;                            /* Ocupa toda a largura */
        height: 40px;                           /* Altura da barra de tarefas */
        background-color: #1a1a1a;            /* Cor de fundo da barra de tarefas */
        border-bottom: 1px solid #333;        /* Borda inferior para destacar a barra */
        display: flex;                          /* Usa flexbox para layout interno */
        align-items: center;                    /* Alinha itens verticalmente ao centro */
        padding: 0 15px;                        /* Preenchimento horizontal para espaçamento interno */
        box-sizing: border-box;                 /* Inclui padding na largura total */
        z-index: 10000;                         /* Garante que a barra fique acima de outros elementos */
        justify-content: space-between;         /* Espaça o título e os botões para as extremidades */
    }

    #taskbar-title {                        /* APLICA AO TÍTULO NA BARRA DE TAREFAS: */
        font-weight: bold;                      /* Negrito para destacar o título */
        font-size: 14px;                        /* Tamanho de fonte um pouco maior para o título */ 
        color: #888;                          /* Cor do título para diferenciar dos botões */
    }

    #taskbar-actions button {               /* APLICA AOS BOTÕES NA BARRA DE TAREFAS: */
        background: transparent;                /* Fundo transparente para estilo minimalista */
        border: 1px solid #444;               /* Borda sutil para destacar os botões */
        color: #aaa;                          /* Cor do texto dos botões para contraste com o fundo da barra */
        padding: 4px 10px;                      /* Preenchimento para tornar os botões clicáveis e confortáveis */
        cursor: pointer;                        /* Cursor de ponteiro para indicar que são clicáveis */
        font-family: monospace;                 /* Mesma fonte monoespaçada para consistência visual */
        font-size: 12px;                        /* Tamanho de fonte um pouco menor para os botões */
        margin-left: 10px;                      /* Espaçamento entre os botões */
    }

    #taskbar-actions button:hover {         /* APLICA AO PASSAR O MOUSE SOBRE OS BOTÕES: */
        border-color: #00ffcc;              /* Destaca a borda do botão ao passar o mouse */
        color: #00ffcc;                     /* Altera a cor do texto para destacar o botão ao passar o mouse */
    }

        #desktop {                          /* APLICA À ÁREA DE TRABALHO ONDE AS JANELAS FICAM: */
        position: relative;                     /* Permite posicionamento absoluto dos elementos filhos */
        width: 100%;                            /* Ocupa toda a largura da janela */
        height: 100%;                           /* Ocupa toda a altura da janela */
        top: 40px;                              /* Desloca para baixo para não ficar atrás da barra de tarefas */
        box-sizing: border-box;                 /* Inclui padding e bordas na largura e altura total */
    }

    /* Estilo Geral das Janelas */
    .game-window {                              /* APLICA A TODAS AS JANELAS DO JOGO: */
        position: absolute;                         /* Permite posicionamento livre na área de trabalho */
        background-color: #0d0d0d;                /* Fundo escuro para as janelas */
        border: 1px solid #00ffcc;                /* Borda azul neon para as janelas */   
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);/* Sombra para dar profundidade */
        display: flex;                              /* Usa flexbox para layout interno */
        flex-direction: column;                     /* Organiza o conteúdo em coluna (header + content) */
        min-width: 300px;                           /* Largura mínima para evitar janelas muito pequenas */
        min-height: 200px;                          /* Altura mínima para evitar janelas muito pequenas */
        /* Valores iniciais serão sobrescritos pelo JS se houver saved state */
        width: 800px;                               /* Largura inicial padrão */
        height: 500px;                              /* Altura inicial padrão */        
        top: 50px;                                  /* Posição inicial padrão */
        left: 50px;                                 /* Posição inicial padrão */
    }

    /* Barra de Título da Janela (para arrastar) */
    .window-header {                        /* APLICA À BARRA DE TÍTULO DE CADA JANELA: */
        height: 25px;                           /* Altura da barra de título */
        background-color: #1a1a1a;            /* Fundo da barra de título para destacar do conteúdo */
        border-bottom: 1px solid #00ffcc;     /* Borda inferior para separar visualmente do conteúdo */  
        cursor: move;                           /* Indica que pode arrastar */
        display: flex;                          /* Usa flexbox para layout interno */
        align-items: center;                    /* Alinha o título verticalmente ao centro */  
        padding: 0 10px;                        /* Preenchimento horizontal para espaçamento interno */
        user-select: none;                      /* Evita seleção de texto ao clicar e arrastar */
        font-size: 12px;                        /* Tamanho de fonte para o título da janela */
        color: #00ffcc;                       /* Cor do texto do título para contraste com o fundo da barra de título */
        justify-content: space-between;         /* Espaça o título e os botões para as extremidades, caso haja botões futuros */
    }

    .window-title {                         /* APLICA AO TÍTULO DENTRO DA BARRA DE TÍTULO: */
        pointer-events: none;                   /* Permite clicar e arrastar sem selecionar texto */
    }

    /* Conteúdo da Janela */
    .window-content {                       /* APLICA À ÁREA DE CONTEÚDO DE CADA JANELA: */
        flex: 1;                                /* Permite que o conteúdo ocupe todo o espaço disponível abaixo do header */    
        position: relative;                     /* Permite posicionamento absoluto de elementos internos, como o handle de redimensionamento */
        overflow: hidden;                       /* Evita que o conteúdo ultrapasse os limites da janela */
        display: flex;                          /* Usa flexbox para layout interno */
        flex-direction: column;                 /* Organiza o conteúdo em coluna (log + input area) */
    }

    /* Log dentro da janela */
    #log {                                  /* APLICA AO LOG PRINCIPAL DENTRO DA JANELA: */
        flex: 1;                                /* Permite que o log ocupe todo o espaço disponível dentro do conteúdo da janela */
        background-color: black;              /* Fundo preto para o log para destacar as mensagens */
        overflow-y: auto;                       /* Permite rolagem vertical quando o conteúdo ultrapassa a altura do log */
        padding: 10px;                          /* Preenchimento interno para espaçamento entre o texto e as bordas do log */   
        border: none;                           /* Remove bordas para um visual mais limpo */
        color: #00ffcc;                       /* Cor do texto do log para contraste com o fundo preto */
    }

    /* Área de Input dentro da janela */
    #input-area {                           /* APLICA À ÁREA DE INPUT NA PARTE INFERIOR DA JANELA: */
        height: 40px;                           /* Altura da área de input para acomodar o campo de texto e o botão */
        display: flex;                          /* Usa flexbox para layout interno */
        border-top: 1px solid #333;           /* Borda superior para separar visualmente do log */
        background-color: #0d0d0d;            /* Fundo escuro para a área de input para destacar do log */
    }

    #command {                              /* APLICA AO CAMPO DE INPUT DENTRO DA ÁREA DE INPUT: */
        flex: 1;                                /* Permite que o campo de input ocupe todo o espaço disponível dentro da área de input, exceto o espaço do botão */
        background-color: black;              /* Fundo preto para o campo de input para destacar as mensagens */
        color: #00ffcc;                       /* Cor do texto do campo de input para contraste com o fundo preto */
        border: none;                           /* Remove bordas para um visual mais limpo */
        padding: 10px;                          /* Preenchimento interno para espaçamento entre o texto e as bordas do campo de input */
        font-family: monospace;                 /* Mesma fonte monoespaçada para consistência visual */
        outline: none;                          /* Remove o contorno padrão ao focar para um visual mais limpo */
    }

    #btn-send {                             /* APLICA AO BOTÃO DE ENVIO DENTRO DA ÁREA DE INPUT: */
        background-color: #1a1a1a;            /* Fundo escuro para o botão para destacar do campo de input */
        color: #00ffcc;                       /* Cor do texto do botão para contraste com o fundo do botão */
        border: 1px solid #00ffcc;            /* Borda azul neon para destacar o botão */
        padding: 0 15px;                        /* Preenchimento horizontal para tornar o botão clicável e confortável */
        cursor: pointer;                        /* Cursor de ponteiro para indicar que é clicável */
        font-family: monospace;                 /* Mesma fonte monoespaçada para consistência visual */
    }

    #btn-send:hover {                       /* APLICA AO PASSAR O MOUSE SOBRE O BOTÃO DE ENVIO: */
        background-color: #00ffcc;            /* Altera o fundo para azul neon ao passar o mouse para destacar o botão */
        color: black;                         /* Altera a cor do texto para preto para contraste com o novo fundo ao passar o mouse */
    }

    /* Handle de Redimensionamento (Canto Inferior Direito) */
    .resize-handle {                        /* APLICA AO HANDLE DE REDIMENSIONAMENTO NO CANTO INFERIOR DIREITO DE CADA JANELA: */
        width: 15px;                            /* Largura do handle para facilitar o clique */
        height: 15px;                           /* Altura do handle para facilitar o clique */
        position: absolute;                     /* Permite posicionamento no canto inferior direito da janela */
        bottom: 0;                              /* Alinha ao fundo da janela */
        right: 0;                               /* Alinha à direita da janela */
        cursor: nwse-resize;                    /* Cursor de redimensionamento diagonal para indicar a função do handle */
        background: linear-gradient(135deg, transparent 50%, #00ffcc 50%);/* Cria um triângulo azul neon no canto para indicar visualmente o handle de redimensionamento */
        opacity: 0.3;                           /* Opacidade inicial para não distrair, mas visível o suficiente para indicar a função */
        transition: opacity 0.2s;               /* Transição suave para a opacidade ao passar o mouse */
    }

    .resize-handle:hover {                  /* APLICA AO PASSAR O MOUSE SOBRE O HANDLE DE REDIMENSIONAMENTO: */
        opacity: 1;                             /* Aumenta a opacidade ao passar o mouse para destacar o handle de redimensionamento */
    }

</style>
<!-- Fim de Estilo da Interface (aparência visual) -->

</head>
<body>

<!-- #JOGO: Estrutura da Interface (elementos visíveis) =========================================================================================== -->
    <!-- Documentação da ESTRUTURA DA INTERFACE

    Responsabilidade:
        Definir os elementos visíveis da aplicação.

    Funções Atuais:
        - área principal do jogo
        - painel de mensagens
        - campo de entrada
        - botão de envio

    Princípio:
        Representar apenas a estrutura da interface.

    Evitar:
        - regras de comportamento
        - lógica de comunicação
        - processamento de dados

    Objetivo:
        Organizar os componentes que serão manipulados pelo frontend.

    Expansões Futuras:
        - inventário
        - painel de personagem
        - mapa
        - janelas auxiliares
        - elementos de interface avançados
-->

    <!-- Barra de Tarefas Superior -->
    <div id="taskbar">
        <div id="taskbar-title">MUNDO ONLINE v0.4</div>
        <div id="taskbar-actions">
            <button onclick="resetWindowLayout()">Redefinir Layout</button>
            <!-- Futuros botões de novas janelas virão aqui -->
        </div>
    </div>

    <!-- Área de Trabalho -->
    <div id="desktop">
        
        <!-- Janela Principal (Log Principal) -->
        <div id="window-log-principal" class="game-window">
            <div class="window-header">
                <span class="window-title">:: LOG PRINCIPAL ::</span>
                <!-- Sem botão de fechar -->
            </div>
            
            <div class="window-content">
                <div id="log"></div>
                <div id="input-area">
                    <input type="text" id="command" placeholder="Digite um comando..." autocomplete="off">
                    <button id="btn-send" onclick="sendCommand()">Enviar</button>
                </div>
            </div>

            <!-- Handle para redimensionar -->
            <div class="resize-handle" id="resize-handle-principal"></div>
        </div>

    </div>
<!-- Fim de Estrutura da Interface (elementos visíveis) -->

<!-- Script do Frontend (lógica do cliente) ================================================================================================ -->
    <script>
/** =========================================================
    SISTEMA
    =========================================================
    Sessões da Categoria "Sistema" aqui.
    */

    // #SISTEMA: Estado do Frontend (memória local) =========================================================================================================
        /** Documentação do ESTADO DO FRONTEND

            Responsabilidade:
                Armazenar informações locais necessárias para o funcionamento
                da interface.

            Funções Atuais:
                - identificação da sessão
                - histórico de comandos
                - posição no histórico
                - modo atual de entrada

            Princípio:
                Guardar apenas informações necessárias ao cliente.

            Evitar:
                - armazenamento de regras de jogo
                - decisões de autoridade
                - informações críticas do servidor

            Objetivo:
                Permitir que a interface mantenha contexto local de operação.

            Expansões Futuras:
                - preferências do usuário
                - estado visual da interface
                - cache temporário
                - configurações locais
    */
    
    // Configuração inicial da janela principal
    const defaultWindowConfig = {
        width: 800,
        height: 500,
        top: 50,
        left: 50
    };

    function initWindowManagement() {
        const win = document.getElementById('window-log-principal');
        const header = win.querySelector('.window-header');
        const handle = document.getElementById('resize-handle-principal');

        // 1. Carregar estado salvo ou usar padrão
        const savedState = localStorage.getItem('mud_window_layout');
        let currentConfig = savedState ? JSON.parse(savedState) : defaultWindowConfig;

        applyWindowConfig(win, currentConfig);

        // 2. Lógica de Arrastar (Drag)
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragOffsetX = e.clientX - win.offsetLeft;
            dragOffsetY = e.clientY - win.offsetTop;
            win.style.zIndex = 1000; // Trazer para frente
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            let newTop = e.clientY - dragOffsetY;
            let newLeft = e.clientX - dragOffsetX;

            // Limites básicos (não sair da tela)
            const taskbarHeight = 40;
            if (newTop < taskbarHeight) newTop = taskbarHeight;
            if (newLeft < 0) newLeft = 0;

            win.style.top = `${newTop}px`;
            win.style.left = `${newLeft}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                win.style.zIndex = ''; 
                saveWindowConfig();
            }
        });

        // 3. Lógica de Redimensionar (Resize)
        let isResizing = false;

        handle.addEventListener('mousedown', (e) => {
            isResizing = true;
            e.preventDefault(); // Evita seleção de texto
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            const newWidth = e.clientX - win.offsetLeft;
            const newHeight = e.clientY - win.offsetTop;

            if (newWidth > 300) win.style.width = `${newWidth}px`;
            if (newHeight > 200) win.style.height = `${newHeight}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                saveWindowConfig();
            }
        });
    }

    function applyWindowConfig(element, config) {
        element.style.width = `${config.width}px`;
        element.style.height = `${config.height}px`;
        element.style.top = `${config.top}px`;
        element.style.left = `${config.left}px`;
    }

    function saveWindowConfig() {
        const win = document.getElementById('window-log-principal');
        const config = {
            width: win.offsetWidth,
            height: win.offsetHeight,
            top: win.offsetTop,
            left: win.offsetLeft
        };
        localStorage.setItem('mud_window_layout', JSON.stringify(config));
    }

    function resetWindowLayout() {
        if(confirm("Deseja redefinir a posição e tamanho das janelas para o padrão?")) {
            localStorage.removeItem('mud_window_layout');
            const win = document.getElementById('window-log-principal');
            applyWindowConfig(win, defaultWindowConfig);
        }
    }

    /**
     * LÓGICA DO JOGO (WebSocket e Comandos)
     */
    let commandHistory = [];
    let historyIndex = -1;
    let inputMode = "normal";
    let socket = null;

    window.onload = function () {
        // Inicializa sistema de janelas
        initWindowManagement();

        const input = document.getElementById("command");
        const btnSend = document.getElementById("btn-send");

        // Atalhos de Teclado
        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                sendCommand();
            }
            else if (e.key === "ArrowUp") {
                if (inputMode === "normal" && historyIndex > 0) {
                    historyIndex--;
                    this.value = commandHistory[historyIndex];
                    e.preventDefault();
                }
            }
            else if (e.key === "ArrowDown") {
                if (inputMode === "normal" && historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    this.value = commandHistory[historyIndex];
                    e.preventDefault();
                } else {
                    historyIndex = commandHistory.length;
                    this.value = "";
                    e.preventDefault();
                }
            }
        });

        // Conexão WebSocket
        addLog("Conectando ao mundo...");
        
        let wsUrl;
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            wsUrl = "ws://127.0.0.1:8000/ws";
        } else {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            wsUrl = `${protocol}//${window.location.host}/ws`;
        }
        
        socket = new WebSocket(wsUrl);

        socket.onopen = function() {
            addLog("Conexão estabelecida.");
        };

        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                syncUIState(data);
                if (data.response) {
                    addLog(data.response);
                }
            } catch (e) {
                console.error(e);
            }
        };

        socket.onclose = function() {
            addLog("Conexão perdida. Recarregando...");
            setTimeout(() => window.location.reload(), 3000);
        };
        
        socket.onerror = function(error) {
            console.error("Erro WS:", error);
            // Não exibe erro no log principal para não poluir, mas poderia
        };
    };    

    function sendCommand() {
        const input = document.getElementById("command");
        const command = input.value.trim();
        if (!command) return;
            
        if (inputMode === "normal") {
            commandHistory.push(command);
            historyIndex = commandHistory.length;
        }

        if (!socket || socket.readyState !== WebSocket.OPEN) {
            addLog("Sem conexão.");
            return;
        }

        socket.send(command);
        input.value = "";
        
        if (inputMode !== "senha" && inputMode !== "confirmacao") {
            input.focus();
        }
    }

    function syncUIState(data) {
        if (data.mode) {
            updateInputMode(data.mode);
        } else {
            updateInputMode("normal");
        }
    }

    function addLog(text) {
        const log = document.getElementById("log");
        log.innerHTML += "<div>> " + text + "</div>";
        log.scrollTop = log.scrollHeight;
    }

    function updateInputMode(mode) {
        const input = document.getElementById("command");
        inputMode = mode;
        if (mode === "senha" || mode === "confirmacao") {
            input.type = "password";
            input.placeholder = "Senha...";
        } else {
            input.type = "text";
            input.placeholder = "Comando...";
        }
    }
    </script>
</body>
</html>
