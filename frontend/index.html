    <!DOCTYPE html>
    <!-- #SISTEMA: Configurações da página =============================================================================================================== -->
    <!-- Documentação das CONFIGURAÇÕES DA PÁGINA

        Responsabilidade:
            Definir informações básicas do documento HTML.

        Funções Atuais:
            - idioma da página
            - codificação de caracteres
            - título da aplicação

        Princípio:
            Centralizar configurações necessárias para o navegador
            interpretar corretamente o documento.

        Evitar:
            - lógica de aplicação
            - estilos visuais
            - comportamento do sistema

        Objetivo:
            Garantir que o frontend seja carregado corretamente.

        Expansões Futuras:
            - favicon
            - metadados
            - SEO
            - configurações de compatibilidade
            - manifestos de aplicação
    -->

    <html lang="pt-br">
    <head>
    <meta charset="UTF-8">
    <title>Mundo Online</title>
    <!-- Fim de Configurações da página -->


    

    <!-- #JOGO: Estilo da Interface (aparência visual) ================================================================================================ -->
    <!-- Documentação do ESTILO DA INTERFACE

        Responsabilidade:
            Definir a aparência visual da interface.

        Funções Atuais:
            - cores do sistema
            - posicionamento dos elementos
            - aparência do log
            - aparência do campo de entrada
            - aparência dos botões

        Princípio:
            Controlar exclusivamente a apresentação visual.

        Evitar:
            - lógica de negócio
            - comunicação com backend
            - regras de jogo

        Objetivo:
            Manter separação clara entre visual e comportamento.

        Expansões Futuras:
            - temas visuais
            - responsividade
            - animações
            - acessibilidade
            - personalização de interface
    -->

    <style>
    body {
        background-color: #0d0d0d;
        color: #00ffcc;
        font-family: monospace;
        display: flex;
        justify-content: center;
    }

    #game {
        width: 800px;
        margin-top: 40px;
    }

    #log {
        background-color: black;
        height: 400px;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #00ffcc;
    }

    #input-area {
        margin-top: 10px;
        display: flex;
    }

    #command {
        flex: 1;
        background-color: black;
        color: #00ffcc;
        border: 1px solid #00ffcc;
        padding: 10px;
    }

    button {
        background-color: black;
        color: #00ffcc;
        border: 1px solid #00ffcc;
        padding: 10px;
        cursor: pointer;
    }
    </style>
    <!-- Fim de Estilo da Interface (aparência visual) -->

    
    </head>

    <body>

    
    <!-- #JOGO: Estrutura da Interface (elementos visíveis) =========================================================================================== -->
    <!-- Documentação da ESTRUTURA DA INTERFACE

        Responsabilidade:
            Definir os elementos visíveis da aplicação.

        Funções Atuais:
            - área principal do jogo
            - painel de mensagens
            - campo de entrada
            - botão de envio

        Princípio:
            Representar apenas a estrutura da interface.

        Evitar:
            - regras de comportamento
            - lógica de comunicação
            - processamento de dados

        Objetivo:
            Organizar os componentes que serão manipulados pelo frontend.

        Expansões Futuras:
            - inventário
            - painel de personagem
            - mapa
            - janelas auxiliares
            - elementos de interface avançados
    -->

    <div id="game">

        <div id="log"></div>

        <div id="input-area">
            <input type="text" id="command" placeholder="Digite um comando...">
            <button onclick="sendCommand()">Enviar</button>
        </div>

    </div>
    <!-- Fim de Estrutura da Interface (elementos visíveis) -->


    

    <!-- Script do Frontend (lógica do cliente) ================================================================================================ -->
    <script>

    // #SISTEMA: Estado do Frontend (memória local) =========================================================================================================

        Responsabilidade:
            Armazenar informações locais necessárias para o funcionamento
            da interface.

        Funções Atuais:
            - identificação da sessão
            - histórico de comandos
            - posição no histórico
            - modo atual de entrada

        Princípio:
            Guardar apenas informações necessárias ao cliente.

        Evitar:
            - armazenamento de regras de jogo
            - decisões de autoridade
            - informações críticas do servidor

        Objetivo:
            Permitir que a interface mantenha contexto local de operação.

        Expansões Futuras:
            - preferências do usuário
            - estado visual da interface
            - cache temporário
            - configurações locais
    */

    let commandHistory = [];
    let historyIndex = -1;
    let inputMode = "normal";
    let socket = null;
    // Fim de Estado do Frontend
    

    // #SISTEMA: Inicialização do Cliente (conexão inicial) =================================================================================================
    /** Documentação da INICIALIZAÇÃO DO CLIENTE

        Responsabilidade:
            Preparar o frontend para interação com o servidor.

        Funções Atuais:
            - registrar atalhos de teclado
            - estabelecer conexão inicial
            - obter sessão
            - exibir mensagens iniciais

        Princípio:
            Executar apenas tarefas necessárias ao carregamento inicial.

        Evitar:
            - regras de jogo
            - processamento contínuo
            - responsabilidades permanentes

        Objetivo:
            Garantir que o cliente esteja pronto para uso.

        Expansões Futuras:
            - carregamento de configurações
            - autenticação automática
            - reconexão
            - sincronização inicial
    */

    //                 this.value = commandHistory[historyIndex];
    //             } else {
    //                 historyIndex = commandHistory.length;
    //                 this.value = "";
    //             }
            
    //             e.preventDefault();
                
            
    //         }
        
    //     });

    //     // Chamada ao backend para registrar conexão
        
    //     try {                                                                       // Tentativa de estabelecer conexão inicial com o backend 
    //         addLog("Conectando ao mundo...");                                       // Mensagem inicial de conexão
    //         const response = await fetch("http://127.0.0.1:8000/connect");          // Chamada ao backend para registrar conexão local
    //         //const response = await fetch("/connect");                             // Chamada ao backend para registrar conexão com o RENDER)  
    //         const data = await response.json();                                     // Processamento da resposta do backend
    //         addLog("Resposta completa do servidor:");
    //         addLog(JSON.stringify(data, null, 2));

    //     if (data.session_id) {                                                      // Verificação da existência de session_id na resposta

    //         }
            
    //         if (data.message) {                                                     // Verificação da existência de mensagem na resposta
    //             const mensagens = data.message.split("\n");                         // Divisão da mensagem em linhas, caso haja múltiplas mensagens separadas por quebras de linha. 
    //             for (let msg of mensagens) {                                        // Iteração sobre cada linha da mensagem

    //         }
    //     } catch (error) {                                                           // Tratamento de erros na conexão inicial
    //         addLog("Erro ao conectar ao mundo.");                                   // Mensagem de erro genérica para o usuário
    //         console.error(error);                                                   // Log detalhado do erro no console para depuração

    // };

    window.onload = function () {
        const input = document.getElementById("command");

        // --- Configuração dos Atalhos de Teclado (Mantido) ---
        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                sendCommand();
            }
            else if (e.key === "ArrowUp") {
                if (!isHistoryEnabled()) return;
                if (historyIndex > 0) {
                    historyIndex--;
                    this.value = commandHistory[historyIndex];
                }
                e.preventDefault();            
            }
            else if (e.key === "ArrowDown") {
                if (!isHistoryEnabled()) return;
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    this.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    this.value = "";
                }
                e.preventDefault();
            }
        });

        // --- Inicialização do WebSocket ---
        addLog("Conectando ao mundo...");
        
        // Define a URL do WebSocket (ajuste a porta se necessário)
        // Definir o wsUrl para o endereço do serviço no render.
        // Determinação automática do endereço do WebSocket
        let wsUrl;
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            // Ambiente Local
            wsUrl = "ws://127.0.0.1:8000/ws";
        } else {
            // Ambiente de Produção (Render, Vercel, etc.)
            // Usa o mesmo hostname da página atual, mas troca http/https por ws/wss
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            wsUrl = `${protocol}//${window.location.host}/ws`;
        }
        socket = new WebSocket(wsUrl);

        socket.onopen = function() {
            addLog("Conexão estabelecida com sucesso.");
            // O servidor já envia a mensagem de boas-vindas automaticamente ao conectar
        };

        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                
                // Atualiza a UI (modo senha, etc)
                syncUIState(data);

                if (data.response) {
                    addLog(data.response);
                }
            } catch (e) {
                addLog("Erro ao processar mensagem do servidor.");
                console.error(e);
            }
        };

        socket.onclose = function() {
            addLog("Conexão perdida. Tentando reconectar em 3 segundos...");
            setTimeout(() => {
                window.location.reload(); // Recarrega a página para reconectar
            }, 3000);
        };

        socket.onerror = function(error) {
            addLog("Erro na conexão WebSocket.");
            console.error(error);
        };
    };    
    
    // Fim de Inicialização do Cliente (conexão inicial)


    // #SISTEMA: Comunicação com o Backend ==================================================================================================================
    /** Documentação da COMUNICAÇÃO COM O BACKEND

        Responsabilidade:
            Enviar dados ao servidor e processar respostas.

        Funções Atuais:
            - envio de comandos
            - recebimento de respostas
            - tratamento de erros
            - atualização da interface

        Princípio:
            Toda comunicação deve ocorrer através da API do servidor.

        Evitar:
            - decisões de autoridade no cliente
            - lógica de jogo local
            - alterações diretas de estado sem confirmação do backend

        Objetivo:
            Manter comunicação simples, previsível e confiável.

        Expansões Futuras:
            - WebSockets
            - eventos em tempo real
            - notificações assíncronas
            - sincronização contínua
            - reconexão automática
    */

    function sendCommand() {
        const input = document.getElementById("command");
        const command = input.value.trim();

        if (!command) return;
            
        if (isHistoryEnabled()) {
            commandHistory.push(command);
            historyIndex = commandHistory.length;
        }

        if (!socket || socket.readyState !== WebSocket.OPEN) {
            addLog("Sem conexão com o mundo. Aguarde...");
            return;
        }

        // Envia o texto puro diretamente pelo WebSocket
        socket.send(command);

        input.value = "";
        input.selectionStart = 0;
        input.selectionEnd = 0;
        
        // Mantém o foco apenas se não estiver em modo de senha
        if (inputMode !== "senha" && inputMode !== "confirmacao") {
            input.focus();
        }
    }
    // Fim de Comunicação com o Backend






    

    /**
    =========================================================
    MOTOR
    =========================================================
    Sessões da Categoria "Motor" aqui.
    */

    // #MOTOR: Controle de Histórico de Comandos ==========================================================================================================
    /** Documentação do CONTROLE DE HISTÓRICO

        Responsabilidade:
            Gerenciar o histórico local de comandos do usuário.

        Funções Atuais:
            - armazenamento de comandos
            - navegação pelo histórico
            - bloqueio durante entrada de senha

        Princípio:
            Fornecer conveniência ao usuário sem comprometer segurança.

        Evitar:
            - armazenamento de informações sensíveis
            - dependência de regras do backend

        Objetivo:
            Melhorar a experiência de uso da interface textual.

        Expansões Futuras:
            - pesquisa de histórico
            - filtros
            - persistência local
            - favoritos
    */

    function isHistoryEnabled() {
        return inputMode === "normal";
    }

    // Fim de Controle de Histórico de Comandos


    // #MOTOR: Sincronização de Estado (backend → frontend) ===============================================================================================
    /** Documentação da SINCRONIZAÇÃO DE ESTADO

        Responsabilidade:
            Refletir no frontend o estado informado pelo backend.

        Funções Atuais:
            - atualização do modo de entrada
            - sincronização de comportamento visual

        Princípio:
            O backend possui autoridade sobre o estado do sistema.
            O frontend apenas reflete esse estado.

        Evitar:
            - inferir estados por conta própria
            - criar estados paralelos
            - duplicar regras do servidor

        Objetivo:
            Manter cliente e servidor sincronizados.

        Expansões Futuras:
            - estados de combate
            - estados de menus
            - estados de seleção
            - modos especiais de interação
    */

    function syncUIState(data) {
        if (data.mode) {
            updateInputMode(data.mode);
        } else {
            updateInputMode("normal");
        }
    }
    // Fim de Sincronização de Estado (backend → frontend)






    
    
    /**
    =========================================================
    JOGO
    =========================================================
    Sessões da Categoria "JOGO" aqui.
    */

    // #JOGO: Funções de Interface (controle visual) =====================================================================================================
    /** Documentação das FUNÇÕES DE INTERFACE

        Responsabilidade:
            Manipular elementos visuais da aplicação.

        Funções Atuais:
            - exibição de mensagens
            - alteração do modo de entrada
            - atualização de componentes visuais

        Princípio:
            Conter apenas lógica relacionada à interface.

        Evitar:
            - regras de jogo
            - comunicação direta complexa
            - processamento de comandos

        Objetivo:
            Centralizar operações de atualização visual.

        Expansões Futuras:
            - notificações
            - janelas modais
            - indicadores visuais
            - animações
            - componentes reutilizáveis
    */

    function addLog(text) {                                                 // Função que recebe um texto como parâmetro e o exibe no painel de mensagens.
        const log = document.getElementById("log");                         // 
        log.innerHTML += "<div>> " + text + "</div>";
        log.scrollTop = log.scrollHeight;
    }

    function updateInputMode(mode) {
        const input = document.getElementById("command");

        inputMode = mode;

        if (mode === "senha" || mode === "confirmacao") {
            input.type = "password";
            input.placeholder = "Digite sua senha...";
        } 
        else {
            input.type = "text";
            input.placeholder = "Digite um comando...";
        }
    }
    // Fim de Funções de Interface (controle visual)
    
    </script>
    <!-- Fim de Script do Frontend (lógica do cliente) -->
    
    </body>
    </html>
